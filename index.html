<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Parser</title>
  <script src="pdf-js.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --border: #e0e3e8;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --danger: #dc2626;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .field label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    select, input[type="file"] {
      font-size: 0.9375rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      min-width: 200px;
    }

    select:focus, input[type="file"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      font-size: 0.9375rem;
      font-weight: 500;
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .warnings {
      background: var(--warn-bg);
      color: var(--warn-text);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      margin-bottom: 1rem;
    }

    .warnings.visible { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
    }

    thead th {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.75rem 0.75rem;
      border-bottom: 2px solid var(--border);
    }

    tbody td {
      padding: 0.625rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:hover { background: #f9fafb; }

    .missing {
      color: var(--muted);
      font-style: italic;
    }

    .eur {
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Invoice Parser</h1>

    <div class="card">
      <div class="controls">
        <div class="field">
          <label for="parser-select">Parser</label>
          <select id="parser-select">
            <option value="french-grid">French Grid (Monnaie / Taux de change)</option>
          </select>
        </div>
        <div class="field">
          <label for="file-input">Invoice PDFs</label>
          <input type="file" id="file-input" accept=".pdf" multiple>
        </div>
        <div class="field">
          <label for="locale-select">Copy Locale</label>
          <select id="locale-select">
            <option value="fr" selected>FR (1 234,56)</option>
            <option value="en">EN (1 234.56)</option>
          </select>
        </div>
        <button id="parse-btn">Parse Invoices</button>
      </div>
    </div>

    <div class="warnings" id="warnings"></div>

    <div class="card" id="results-card">
      <button id="copy-btn" style="display:none;margin-bottom:1rem;">Copy EURs</button>
      <button id="copy-all-btn" style="display:none;margin-bottom:1rem;margin-left:0.5rem;">Copy All</button>
      <div id="results-container">
        <div class="empty-state">
          Select one or more PDF invoices and click <strong>Parse Invoices</strong> to begin.
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── pdf.js setup ──────────────────────────────────────────
    if (typeof pdfjsLib === 'undefined') {
      document.getElementById('results-container').innerHTML =
        '<div class="empty-state" style="color:var(--danger)">pdf.js library failed to load. Make sure <code>pdf-js.min.js</code> is in the same folder as this file.</div>';
      document.getElementById('parse-btn').disabled = true;
      throw new Error('pdf.js library (pdf-js.min.js) not loaded');
    }
    <!-- BUILD:WORKER -->
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf-js.worker.min.js';

    // ── Parser interface (base class) ─────────────────────────
    class InvoiceParser {
      /**
       * @param {Array<{str: string, x: number, y: number, width: number, height: number}>} content
       *   Flattened TextContent items from all PDF pages, each with positional data.
       * @returns {{ currency: string|null, amount: number|null, conversionRate: number|null }}
       */
      parse(content) {
        throw new Error('parse() must be implemented by subclass');
      }

      /** @returns {string} Human-readable name for the dropdown */
      get name() {
        return this.constructor.name;
      }
    }

    // ── Spatial utilities ─────────────────────────────────────
    /**
     * Groups TextContent items into rows using y-coordinate tolerance.
     * @param {Array<{str: string, x: number, y: number, width: number, height: number}>} items
     * @param {number} tolerance - Max y-difference for items to be on the same row (default 2)
     * @returns {Array<{y: number, items: Array}>} Rows sorted top-to-bottom (descending y), each with items sorted left-to-right
     */
    function groupItemsIntoRows(items, tolerance = 2) {
      if (items.length === 0) return [];

      const seen = new Set();

      const uniqueItems = items.filter(item => {
        const key = `${item.x}|${item.y}|${item.str.trim()}`;

        if (seen.has(key)) {
          return false;
        }

        seen.add(key);
        return true;
      });

      // Sort by y descending (top of page = higher y), then by x ascending
      const sorted = [...uniqueItems].sort((a, b) => b.y - a.y || a.x - b.x);

      const rows = [];
      for (const item of sorted) {
        // Find an existing row within tolerance
        if (item.str.trim() === '') continue; // Skip empty strings
        let placed = false;
        for (const row of rows) {
          if (Math.abs(row.y - item.y) <= tolerance) {
            row.items.push(item);
            placed = true;
            break;
          }
        }
        if (!placed) {
          rows.push({ y: item.y, items: [item] });
        }
      }

      // Sort each row's items left-to-right, rows top-to-bottom
      for (const row of rows) {
        row.items.sort((a, b) => a.x - b.x);
      }
      rows.sort((a, b) => b.y - a.y);

      return rows;
    }

    /**
     * Finds the item in a row that matches a regex pattern.
     * @returns {object|null} The matching item, or null
     */
    function findItemInRow(row, pattern) {
      return row.items.find(item => pattern.test(item.str)) || null;
    }

    /**
     * Extracts values from the row immediately below a section header, bounded by x-range.
     * @param {Array} rows - All rows from groupItemsIntoRows()
     * @param {number} headerRowIndex - Index of the section header row
     * @param {number} xMin - Left x-boundary (inclusive)
     * @param {number|null} xMax - Right x-boundary (exclusive), or null for no bound
     * @returns {Array<string>} String values from the next row, left-to-right, within x bounds
     */
    function extractValuesBelowSection(rows, headerRowIndex, xMin, xMax) {
      const nextRowIndex = headerRowIndex + 1;
      if (nextRowIndex >= rows.length) return [];

      const nextRow = rows[nextRowIndex];
      return nextRow.items
        .filter(item => item.x >= xMin && (xMax === null || item.x < xMax))
        .map(item => item.str);
    }

    // ── French Grid Parser ────────────────────────────────────
    class FrenchGridParser extends InvoiceParser {
      get name() { return 'French Grid (Monnaie / Taux de change)'; }

      // Section patterns (regex tested against item.str)
      static SECTION_22 = /22\s+monnaie\s+et\s+montant\s+total\s+factur[ée]/i;
      static SECTION_23 = /23\s+taux\s+de\s+change/i;

      parse(content) {
        const result = { currency: null, amount: null, conversionRate: null };

        if (!content || content.length === 0) return result;

        const rows = groupItemsIntoRows(content, 2);

        // ── Find section header rows ──
        const section22RowIdx = rows.findIndex(row => findItemInRow(row, FrenchGridParser.SECTION_22));
        const section23RowIdx = rows.findIndex(row => findItemInRow(row, FrenchGridParser.SECTION_23));

        // ── Section 22: Currency & Amount (expect exactly 2 values) ──
        if (section22RowIdx !== -1) {
          const headerItemIdx = rows[section22RowIdx].items.findIndex(item => FrenchGridParser.SECTION_22.test(item.str));
          const headerItem = rows[section22RowIdx].items[headerItemIdx];
          const xMin = headerItem.x;
          const xMax = rows[section22RowIdx].items[headerItemIdx + 1]?.x || null;
          const values = extractValuesBelowSection(rows, section22RowIdx, xMin, xMax);

          if (values.length === 2) {
            result.currency = values[0];
            result.amount = parseFloat(values[1]);
          }
          // If not exactly 2, both remain null
        }

        // ── Section 23: Conversion Rate (expect exactly 1 value) ──
        if (section23RowIdx !== -1) {
          const headerItemIdx = rows[section23RowIdx].items.findIndex(item => FrenchGridParser.SECTION_23.test(item.str));
          const headerItem = rows[section23RowIdx].items[headerItemIdx];
          const xMin = headerItem.x;
          const xMax = rows[section23RowIdx].items[headerItemIdx + 1]?.x || null;
          const values = extractValuesBelowSection(rows, section23RowIdx, xMin, xMax);

          if (values.length >= 1 && values.length <= 2) {
            result.conversionRate = parseFloat(values[0]);
          }
          // If not between 1 and 2, remains null
        }

        return result;
      }
    }

    // ── Parser registry ───────────────────────────────────────
    const parsers = [
      new FrenchGridParser()
    ];

    // ── PDF text extraction ───────────────────────────────────
    /**
     * Extracts all TextContent items from a PDF, flattened across all pages.
     * Each item includes positional data (x, y, width, height) from the pdf.js transform.
     * @param {File} file
     * @returns {Promise<Array<{str: string, x: number, y: number, width: number, height: number}>>}
     */
    async function extractContentFromPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const allItems = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        for (const item of content.items) {
          allItems.push({
            str: item.str,
            x: item.transform[4],
            y: item.transform[5],
            width: item.width,
            height: item.height
          });
        }
      }

      return allItems;
    }

    // ── Main parse flow ──────────────────────────────────────
    async function parseInvoices(files, parser) {
      const results = [];
      let warningCount = 0;

      for (const file of files) {
        let row = {
          filename: file.name,
          currency: null,
          amount: null,
          conversionRate: null,
          eurEquivalent: null
        };

        try {
          const content = await extractContentFromPdf(file);
          const parsed = parser.parse(content);

          row.currency = parsed.currency;
          row.amount = parsed.amount;
          row.conversionRate = parsed.conversionRate;

          // Compute EUR equivalent
          if (row.amount !== null && row.conversionRate !== null) {
            row.eurEquivalent = +(row.amount / row.conversionRate).toFixed(2);
          }

          // Count missing fields
          if (!row.currency || row.amount === null || row.conversionRate === null) {
            warningCount++;
          }
        } catch (err) {
          console.error(`Error parsing ${file.name}:`, err);
          warningCount++;
        }

        results.push(row);
      }

      return { results, warningCount };
    }

    // ── Render ────────────────────────────────────────────────
    function formatCurrency(code) {
      return code || '<span class="missing">—</span>';
    }

    function formatAmount(val) {
      if (val === null || val === undefined) return '<span class="missing">—</span>';
      return val.toFixed(2);
    }

    function formatRate(val) {
      if (val === null || val === undefined) return '<span class="missing">—</span>';
      return val.toFixed(5);
    }

    function renderResults({ results, warningCount }) {
      const warningsEl = document.getElementById('warnings');
      const container = document.getElementById('results-container');
      const copyBtn = document.getElementById('copy-btn');
      const copyAllBtn = document.getElementById('copy-all-btn');

      // Warnings
      if (warningCount > 0) {
        warningsEl.textContent =
          `⚠ ${warningCount} of ${results.length} invoice(s) have missing or unparseable fields.`;
        warningsEl.classList.add('visible');
      } else {
        warningsEl.classList.remove('visible');
      }

      // Store results for copy
      window._lastResults = results;

      // Show/hide copy buttons
      const hasEur = results.some(r => r.eurEquivalent !== null);
      copyBtn.style.display = hasEur ? '' : 'none';
      copyAllBtn.style.display = results.length > 0 ? '' : 'none';

      // Build table
      let html = `
        <table>
          <thead>
            <tr>
              <th>Filename</th>
              <th>Currency</th>
              <th>Amount</th>
              <th>Conversion Rate</th>
              <th>EUR Equivalent</th>
            </tr>
          </thead>
          <tbody>`;

      for (const row of results) {
        html += `
            <tr>
              <td>${escapeHtml(row.filename)}</td>
              <td>${formatCurrency(row.currency)}</td>
              <td>${formatAmount(row.amount)}</td>
              <td>${formatRate(row.conversionRate)}</td>
              <td class="eur">${formatAmount(row.eurEquivalent)}</td>
            </tr>`;
      }

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Copy to clipboard ────────────────────────────────────
    function getLocaleDecimalSep() {
      const locale = document.getElementById('locale-select').value;
      return locale === 'fr' ? ',' : '.';
    }

    function formatNumberForCopy(val, decimals) {
      if (val === null || val === undefined) return '';
      const sep = getLocaleDecimalSep();
      const fixed = val.toFixed(decimals);
      return sep === ',' ? fixed.replace('.', ',') : fixed;
    }

    function copyToClipboard(text, btnElement) {
      // Try modern async Clipboard API first (requires HTTPS or localhost)
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showCopySuccess(btnElement);
        }).catch(() => {
          // Clipboard API failed (e.g., file:// protocol) — use fallback
          fallbackCopy(text, btnElement);
        });
      } else {
        fallbackCopy(text, btnElement);
      }
    }

    function fallbackCopy(text, btnElement) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showCopySuccess(btnElement);
      } catch (err) {
        console.error('Clipboard write failed:', err);
      }
      document.body.removeChild(textarea);
    }

    function showCopySuccess(btn) {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 2000);
    }

    function copyEurValues() {
      const results = window._lastResults || [];
      const values = results
        .filter(r => r.eurEquivalent !== null)
        .map(r => formatNumberForCopy(r.eurEquivalent, 2));

      if (values.length === 0) return;
      copyToClipboard(values.join('\n'), document.getElementById('copy-btn'));
    }

    function copyAllValues() {
      const results = window._lastResults || [];
      if (results.length === 0) return;

      const headers = ['Filename', 'Currency', 'Amount', 'Conversion Rate', 'EUR Equivalent'];
      const rows = [headers.join('\t')];

      for (const r of results) {
        const cells = [
          r.filename,
          r.currency || '',
          formatNumberForCopy(r.amount, 2),
          formatNumberForCopy(r.conversionRate, 5),
          formatNumberForCopy(r.eurEquivalent, 2)
        ];
        rows.push(cells.join('\t'));
      }

      copyToClipboard(rows.join('\n'), document.getElementById('copy-all-btn'));
    }

    // ── Event handlers ────────────────────────────────────────
    document.getElementById('copy-btn').addEventListener('click', copyEurValues);
    document.getElementById('copy-all-btn').addEventListener('click', copyAllValues);

    document.getElementById('parse-btn').addEventListener('click', async () => {
      const fileInput = document.getElementById('file-input');
      const parserSelect = document.getElementById('parser-select');
      const btn = document.getElementById('parse-btn');

      const files = fileInput.files;
      if (!files || files.length === 0) {
        alert('Please select at least one PDF file.');
        return;
      }

      const parser = parsers[parserSelect.selectedIndex];

      // Show loading state
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="display:inline-block"></span>Parsing…';
      document.getElementById('warnings').classList.remove('visible');
      document.getElementById('copy-btn').style.display = 'none';
      document.getElementById('copy-all-btn').style.display = 'none';
      document.getElementById('results-container').innerHTML =
        '<div class="empty-state">Parsing invoices…</div>';

      try {
        const result = await parseInvoices(files, parser);
        renderResults(result);
      } catch (err) {
        console.error(err);
        document.getElementById('results-container').innerHTML =
          '<div class="empty-state" style="color:var(--danger)">An unexpected error occurred. Check the console for details.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Parse Invoices';
      }
    });
  </script>
</body>
</html>
