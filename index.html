<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Parser</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --border: #e0e3e8;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --danger: #dc2626;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .field label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    select, input[type="file"] {
      font-size: 0.9375rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      min-width: 200px;
    }

    select:focus, input[type="file"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      font-size: 0.9375rem;
      font-weight: 500;
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .warnings {
      background: var(--warn-bg);
      color: var(--warn-text);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      margin-bottom: 1rem;
    }

    .warnings.visible { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
    }

    thead th {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.75rem 0.75rem;
      border-bottom: 2px solid var(--border);
    }

    tbody td {
      padding: 0.625rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:hover { background: #f9fafb; }

    .missing {
      color: var(--muted);
      font-style: italic;
    }

    .eur {
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Invoice Parser</h1>

    <div class="card">
      <div class="controls">
        <div class="field">
          <label for="parser-select">Parser</label>
          <select id="parser-select">
            <option value="french-grid">French Grid (Monnaie / Taux de change)</option>
          </select>
        </div>
        <div class="field">
          <label for="file-input">Invoice PDFs</label>
          <input type="file" id="file-input" accept=".pdf" multiple>
        </div>
        <button id="parse-btn">Parse Invoices</button>
      </div>
    </div>

    <div class="warnings" id="warnings"></div>

    <div class="card" id="results-card">
      <div id="results-container">
        <div class="empty-state">
          Select one or more PDF invoices and click <strong>Parse Invoices</strong> to begin.
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── pdf.js setup ──────────────────────────────────────────
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ── Parser interface (base class) ─────────────────────────
    class InvoiceParser {
      /** @param {string} text - Full extracted text from the PDF */
      /** @returns {{ currency: string|null, amount: number|null, conversionRate: number|null }} */
      parse(text) {
        throw new Error('parse() must be implemented by subclass');
      }

      /** @returns {string} Human-readable name for the dropdown */
      get name() {
        return this.constructor.name;
      }
    }

    // ── French Grid Parser ────────────────────────────────────
    class FrenchGridParser extends InvoiceParser {
      get name() { return 'French Grid (Monnaie / Taux de change)'; }

      parse(text) {
        const result = { currency: null, amount: null, conversionRate: null };

        // Normalize whitespace and line breaks
        const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        // Split into lines for grid-style matching
        const lines = normalized.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        // ── Section 22: Currency & Amount ──
        const monnaieIdx = lines.findIndex(l =>
          /22\s+monnaie\s+et\s+montant\s+total\s+factur[ée]/i.test(l)
        );
        
        if (monnaieIdx !== -1) {
          const currency = lines[monnaieIdx + 1];
          if (currency) {
            result.currency = currency;
          }
         
          const amount = lines[monnaieIdx + 2];
          if (amount) {
            result.amount = parseFloat(amount);
          }
        }

        // ── Section 23: Conversion Rate ──
        const tauxIdx = lines.findIndex(l =>
          /taux\s+de\s+change/i.test(l)
        );

        if (tauxIdx !== -1) {
          const conversionRate = lines[tauxIdx + 8];
          if (conversionRate) {
            result.conversionRate = parseFloat(conversionRate);
          }
        }

        return result;
      }
    }

    // ── Parser registry ───────────────────────────────────────
    const parsers = [
      new FrenchGridParser()
    ];

    // ── PDF text extraction ───────────────────────────────────
    async function extractTextFromPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        const pageText = content.items.map(item => item.str).join('\n');
        fullText += pageText + '\n';
      }

      return fullText;
    }

    // ── Main parse flow ──────────────────────────────────────
    async function parseInvoices(files, parser) {
      const results = [];
      let warningCount = 0;

      for (const file of files) {
        let row = {
          filename: file.name,
          currency: null,
          amount: null,
          conversionRate: null,
          eurEquivalent: null
        };

        try {
          const text = await extractTextFromPdf(file);
          const parsed = parser.parse(text);

          row.currency = parsed.currency;
          row.amount = parsed.amount;
          row.conversionRate = parsed.conversionRate;

          // Compute EUR equivalent
          if (row.amount !== null && row.conversionRate !== null) {
            row.eurEquivalent = +(row.amount * row.conversionRate).toFixed(2);
          }

          // Count missing fields
          if (!row.currency || row.amount === null || row.conversionRate === null) {
            warningCount++;
          }
        } catch (err) {
          console.error(`Error parsing ${file.name}:`, err);
          warningCount++;
        }

        results.push(row);
      }

      return { results, warningCount };
    }

    // ── Render ────────────────────────────────────────────────
    function formatCurrency(code) {
      return code || '<span class="missing">—</span>';
    }

    function formatAmount(val) {
      if (val === null || val === undefined) return '<span class="missing">—</span>';
      return val.toFixed(2);
    }

    function formatRate(val) {
      if (val === null || val === undefined) return '<span class="missing">—</span>';
      return val.toFixed(5);
    }

    function renderResults({ results, warningCount }) {
      const warningsEl = document.getElementById('warnings');
      const container = document.getElementById('results-container');

      // Warnings
      if (warningCount > 0) {
        warningsEl.textContent =
          `⚠ ${warningCount} of ${results.length} invoice(s) have missing or unparseable fields.`;
        warningsEl.classList.add('visible');
      } else {
        warningsEl.classList.remove('visible');
      }

      // Build table
      let html = `
        <table>
          <thead>
            <tr>
              <th>Filename</th>
              <th>Currency</th>
              <th>Amount</th>
              <th>Conversion Rate</th>
              <th>EUR Equivalent</th>
            </tr>
          </thead>
          <tbody>`;

      for (const row of results) {
        html += `
            <tr>
              <td>${escapeHtml(row.filename)}</td>
              <td>${formatCurrency(row.currency)}</td>
              <td>${formatAmount(row.amount)}</td>
              <td>${formatRate(row.conversionRate)}</td>
              <td class="eur">${formatAmount(row.eurEquivalent)}</td>
            </tr>`;
      }

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Event handlers ────────────────────────────────────────
    document.getElementById('parse-btn').addEventListener('click', async () => {
      const fileInput = document.getElementById('file-input');
      const parserSelect = document.getElementById('parser-select');
      const btn = document.getElementById('parse-btn');

      const files = fileInput.files;
      if (!files || files.length === 0) {
        alert('Please select at least one PDF file.');
        return;
      }

      const parser = parsers[parserSelect.selectedIndex];

      // Show loading state
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="display:inline-block"></span>Parsing…';
      document.getElementById('warnings').classList.remove('visible');
      document.getElementById('results-container').innerHTML =
        '<div class="empty-state">Parsing invoices…</div>';

      try {
        const result = await parseInvoices(files, parser);
        renderResults(result);
      } catch (err) {
        console.error(err);
        document.getElementById('results-container').innerHTML =
          '<div class="empty-state" style="color:var(--danger)">An unexpected error occurred. Check the console for details.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Parse Invoices';
      }
    });
  </script>
</body>
</html>
